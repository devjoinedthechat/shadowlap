<svg xmlns="http://www.w3.org/2000/svg" width="637" height="764" viewBox="0 0 637 764" role="img" aria-labelledby="title desc">
<title id="title">Shadowlap in a terminal: a refund agent recorded, replayed exactly, blamed to the model call that lost the run, and replayed with the fix</title>
<desc id="desc">$ shadowlap run -- node agent.mjs A-1042
Refunded $240 for A-1042 and emailed the customer.

● Recorded 01M5FYCCTQ2EJ9FZ97VT4JYEK6: 9 calls (5 api, 4 tool), 5 upstream requests, ≈$0.0037

$ shadowlap replay 01M5FYCCTQ
Refunded $240 for A-1042 and emailed the customer.

✓ Replay clean: 9/9 calls replayed (5 api, 4 tool), 0 upstream requests, 2k input tokens not re-spent (≈$0.0037)

$ shadowlap blame 01M5FYCCTQ --expect @refund-check.json
⑂ The run was lost at model call #5 (3 of 5)
  Confidence: high (rescue stops cleanly at the boundary)

  At #5  the recording   "Issuing the refund.", issue_refund({"order_id":"A-1042","amount":240})
         a rescued fork  "Above the limit.", escalate({"reason":"refund of $240 is above $100"})

$ # agent.mjs: escalate refunds above the limit

$ shadowlap replay 01M5FYCCTQ --expect @refund-check.json
Escalated: the refund of $240 for A-1042 is above the $100 limit.

⑂ Forked at call 1: 0 calls replayed, then 6 live, 2 writes blocked; 5 upstream requests (≈$0.0039 spent, $0 saved)
  ~ $.system
      - "You are a support agent. Follow the refund policy."
      + "You are a support agent. Follow the refund policy: escalate every refund above the limit."
✓ 1 check passed (--expect)
  ✓ issue_refund with {"amount":240} called 0 times</desc>
