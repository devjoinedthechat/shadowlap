name: Action

# The GitHub Action in action.yml, used the way a repository uses it: a committed recording that
# replays clean, the same recording against a changed agent, and a job where the action has to
# build the CLI from its own source. Every step sets build-from-source: otherwise the action
# installs its own release from npm, and the CLI of the commit under test is no release.
on:
  push:
    branches: [main]
    paths: ['action.yml', 'action/**', 'packages/**', 'testing/golden/**', 'testing/reference-agent/**', '.github/workflows/action.yml']
  pull_request:
    paths: ['action.yml', 'action/**', 'packages/**', 'testing/golden/**', 'testing/reference-agent/**', '.github/workflows/action.yml']
  workflow_dispatch:
  # The release runs it on the tagged commit, and publishes only if it passes (release.yml).
  workflow_call:

# The jobs read the repository and nothing else.
permissions:
  contents: read

# A pull request's newest push cancels the run of the one before; every other run goes to the end.
concurrency:
  group: action-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  built:
    needs: scope
    name: on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.full == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # build-from-source finds the CLI built above and runs it, building nothing again.
      - name: A recording that still matches passes
        id: clean
        uses: ./
        with:
          recordings: testing/golden/*
          build-from-source: 'true'
      - name: The same recording against a changed agent fails
        id: changed
        uses: ./
        env:
          AGENT_SYSTEM_SUFFIX: Be brief.
        with:
          recordings: testing/golden/reference-agent
          fail-on-divergence: 'false'
          annotations: 'false'
          build-from-source: 'true'
      - name: Check what the action reported
        shell: bash
        env:
          CLEAN_PASSED: ${{ steps.clean.outputs.passed }}
          CLEAN_FAILED: ${{ steps.clean.outputs.failed }}
          CHANGED_FAILED: ${{ steps.changed.outputs.failed }}
          CHANGED_REPORT: ${{ steps.changed.outputs.report-markdown }}
        run: |
          set -euo pipefail
          echo "clean: $CLEAN_PASSED passed, $CLEAN_FAILED failed; changed: $CHANGED_FAILED failed"
          [ "$CLEAN_PASSED" = 1 ] && [ "$CLEAN_FAILED" = 0 ] && [ "$CHANGED_FAILED" = 1 ]
          grep -q 'diverged at call 3' "$CHANGED_REPORT"

  from-source:
    name: building the CLI from its source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install or build: the action builds shadowlap itself. That build also produces the
      # reference agent the golden recording runs.
      - name: Replay the golden
        id: test
        uses: ./
        with:
          recordings: testing/golden/reference-agent
          build-from-source: 'true'
      - shell: bash
        env:
          PASSED: ${{ steps.test.outputs.passed }}
        run: '[ "$PASSED" = 1 ]'
