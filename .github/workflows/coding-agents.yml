name: Coding agents

# The skills (in the Claude Code plugin, and as `shadowlap skill install agents` copies them into
# .agents/skills for the other coding agents) and the section docs/agents.md gives to paste tell
# coding agents which shadowlap commands to run. This job runs every command they name against the
# reference agent, with the scripted fake of the Anthropic API (no key, no model), checks that the
# JSON fields they say to read are there and that the checks they show parse, so the instructions
# never drift from the CLI. The same tests hold the skills' frontmatter and their shared copies to
# their formats (testing/coding-agents/test/formats.test.ts). Then Claude Code's own validator checks
# the plugin's manifest, the repository's marketplace file and the copy `shadowlap skill install`
# puts in a project; it reads a skill only for its description, so the Agent Skills format's
# reference validator checks every skill and every copy in .agents/skills as well.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository, and it runs a package downloaded from npm: its token can do no more.
permissions:
  contents: read

# A pull request's newest push cancels the run of the one before; every other run goes to the end.
concurrency:
  group: coding-agents-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  skill:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: the skill's commands against the reference agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run every command the skill, the rule and the pasted section name
        run: npx vitest run testing/coding-agents
      - name: Validate the plugin, the marketplace and an installed copy with Claude Code
        # The validator reads files only: no sign-in, no model call. Pinned, so a new release of it
        # changes this job only when the version here does.
        env:
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          SHADOWLAP_TELEMETRY: '0'
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.292 plugin validate --strict coding-agents/claude-code
          npx --yes @anthropic-ai/claude-code@2.1.292 plugin validate --strict .
          mkdir "$RUNNER_TEMP/project"
          (cd "$RUNNER_TEMP/project" && node "$GITHUB_WORKSPACE/packages/cli/bin/shadowlap.js" skill install)
          npx --yes @anthropic-ai/claude-code@2.1.292 plugin validate --strict "$RUNNER_TEMP/project/.claude/skills/shadowlap"
      - name: Validate the skills, and the copies installed in .agents/skills, with the Agent Skills reference validator
        # skills-ref is the format's own validator (agentskills.io); pinned, as the one above is.
        env:
          SHADOWLAP_TELEMETRY: '0'
        run: |
          mkdir "$RUNNER_TEMP/agents"
          (cd "$RUNNER_TEMP/agents" && node "$GITHUB_WORKSPACE/packages/cli/bin/shadowlap.js" skill install agents)
          for skill in coding-agents/claude-code/skills/* "$RUNNER_TEMP"/agents/.agents/skills/*; do
            pipx run --spec skills-ref==0.1.1 agentskills validate "$skill"
          done
