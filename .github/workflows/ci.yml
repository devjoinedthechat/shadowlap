name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand it covers macOS and Windows too, as every run does once the repository is
  # public (scope.yml).
  workflow_dispatch:

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  test:
    needs: scope
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
        node: [22, 24]
        include:
          # The oldest Node the packages' engines allow, the first 22 whose built-in SQLite has
          # full-text search, which every store has. Here the packages are built and the suite, the
          # golden replay and the smoke below run on it, so an API newer than the minimum fails;
          # the typecheck and the Python SDK's tests, which no Node changes, run on 22 and 24.
          - os: ubuntu-latest
            node: 22.16.0
            minimum: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The provider SDKs the Python agents in testing/ build their clients with (testing/default-clients).
      - run: python -m pip install --quiet anthropic openai google-genai boto3
      - run: npm ci
      - run: npm run build
      # Test files are outside the build graph (each package compiles only src), so they get
      # their own strict pass. Without it a type error in a test only ever shows up at runtime.
      - run: npm run typecheck:tests
        if: ${{ !matrix.minimum }}
      - run: npm test
      - name: Python SDK tests
        if: ${{ !matrix.minimum }}
        working-directory: sdks/python
        shell: bash
        run: |
          python -m pip install --quiet pytest trio anyio -e .
          python -m pytest -q
      - name: SDK conformance (typescript and python clients)
        run: node --test --test-reporter=spec testing/conformance/conformance.test.mjs
      - name: shadowlap test (offline golden replay)
        shell: bash
        run: |
          node packages/cli/bin/shadowlap.js test testing/golden/reference-agent --junit shadowlap-junit.xml
          grep -q 'failures="0"' shadowlap-junit.xml
      - name: CLI smoke (record, replay, fork)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/testing/reference-agent/dist/mock-server.js" > mock.url 2>/dev/null &
          MOCK=$!
          for i in $(seq 1 50); do [ -s mock.url ] && break; sleep 0.1; done
          export SHADOWLAP_UPSTREAM_ANTHROPIC="$(cat mock.url)" NO_COLOR=1
          CLI="$GITHUB_WORKSPACE/packages/cli/bin/shadowlap.js"
          AGENT="$GITHUB_WORKSPACE/testing/reference-agent/dist/main.js"
          # Capture, print, then grep: `cmd | grep -q` under pipefail fails when grep closes the pipe early (EPIPE).
          OUT="$(node "$CLI" run -- node "$AGENT" 2>&1)"; echo "$OUT" | tail -4; grep -q 'Recorded' <<<"$OUT"
          RUN="$(node "$CLI" ls | head -1 | awk '{print $1}')"; echo "run: $RUN"
          OUT="$(node "$CLI" replay "$RUN" --strict 2>&1)"; echo "$OUT" | tail -3; grep -q 'Replay clean: 30/30' <<<"$OUT"
          # macOS ships bash 3.2, where `VAR=x fn` doesn't reach a function's children; use env.
          if env AGENT_SYSTEM_SUFFIX='Be brief.' node "$CLI" replay "$RUN" --strict >/dev/null 2>&1; then echo 'expected --strict to fail on a fork'; exit 1; fi
          OUT="$(env AGENT_SYSTEM_SUFFIX='Be brief.' node "$CLI" replay "$RUN" 2>&1)"; echo "$OUT" | tail -8; grep -q 'Diverged at call 3' <<<"$OUT"
          OUT="$(node "$CLI" show "$RUN")"; echo "$OUT" | head -8; grep -q 'send_email' <<<"$OUT"
          # The same scenario in Python, through the CLI: the real anthropic package and the Python SDK.
          PYAGENT="$GITHUB_WORKSPACE/testing/reference-agent/python/agent.py"
          OUT="$(env AGENT_DATE=2026-09-16 node "$CLI" run -- python "$PYAGENT" 2>&1)"; echo "$OUT" | tail -3; grep -q 'Recorded' <<<"$OUT"
          PYRUN="$(node "$CLI" ls | head -1 | awk '{print $1}')"
          OUT="$(env AGENT_DATE=2026-09-16 node "$CLI" replay "$PYRUN" --strict 2>&1)"; echo "$OUT" | tail -2; grep -q 'Replay clean: 30/30' <<<"$OUT"
          OUT="$(env AGENT_DATE=2026-09-17 node "$CLI" replay "$PYRUN" 2>&1)"; echo "$OUT" | tail -6; grep -q 'Diverged at call 3' <<<"$OUT"
          kill $MOCK
      # `if: always()` is the whole point: the run that fails is the one whose report is worth
      # keeping. Test files run in parallel workers, so a failure that does not reproduce locally is
      # only ever identifiable from the report of the run that saw it.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            vitest-junit.xml
            shadowlap-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The Python SDK supports 3.9 onward, and some of what it promises (an injected timeout is an
  # asyncio.TimeoutError) differs before 3.11: its own tests run on the oldest version, current ones,
  # and the free-threaded build of 3.14 (3.14t), where nothing holds the GIL for the SDK. trio and anyio
  # are installed for the tests that run tools under them; the SDK itself needs neither. Each job also
  # builds the wheel and checks it carries py.typed and the shadowlap command.
  # Ubuntu 24.04, not ubuntu-latest: setup-python has no 3.9 for Ubuntu 26.04, which ubuntu-latest
  # becomes from October 19, 2026.
  python-sdk:
    name: python sdk on ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.13', '3.14', '3.14t']
        include:
          # Installing shadowlap loads its pytest plugin into every pytest run, so it must load on the
          # oldest pytest it supports with the oldest pluggy that allows, and on pytest 7.4 with pluggy
          # 1.1 (before new-style hook wrappers). anyio's own pytest plugin needs a newer pluggy, so
          # those two run the async tests under trio alone.
          - python: '3.9'
            pytest: pytest==6.2.5 pluggy==0.13.1
            async: trio
          - python: '3.10'
            pytest: pytest==7.4.4 pluggy==1.1.0
            async: trio
    env:
      SHADOWLAP_TEST_WHEEL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet ${{ matrix.pytest || 'pytest' }} ${{ matrix.async || 'trio anyio' }} -e sdks/python
      - run: python -m pytest -q sdks/python/tests

  # The SDK's types, to mypy's strictest settings (sdks/python/pyproject.toml), checked against the
  # real types of trio, anyio and pytest. Pinned, so a new mypy changes this job only when the pin does.
  python-sdk-types:
    name: python sdk types (mypy --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet mypy==2.4.0 pytest trio anyio -e sdks/python
      - name: mypy --strict
        working-directory: sdks/python
        run: python -m mypy
