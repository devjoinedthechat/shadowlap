name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand it covers macOS and Windows too, as every run does once the repository is
  # public (scope.yml).
  workflow_dispatch:
  # The release runs it on the tagged commit, and publishes only if it passes (release.yml).
  workflow_call:

# The jobs read the repository and nothing else.
permissions:
  contents: read

# A pull request's newest push cancels the run of the one before; every other run goes to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every pip install below, what builds a package for it included, takes its versions from one file
  # (testing/python-constraints.in says how it is made).
  PIP_CONSTRAINT: ${{ github.workspace }}/testing/python-constraints.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/testing/python-constraints.txt

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  # ESLint over every package, its tests and the repository's JavaScript, with typescript-eslint's
  # typed rules, ruff over the Python and mypy --strict over the Python guard: `npm run lint`, which
  # fails on any finding. ESLint reads the packages through their built declarations, so the job
  # builds first; ruff and mypy run through uvx.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet uv==0.12.16
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  # The suite with V8's coverage, as a report in the vitest-coverage artifact (coverage/index.html,
  # and the summary in the log): a place to look, never a gate. The job may fail without failing the
  # run, and has no thresholds; a failing test is the test job's to report. What the end-to-end tests
  # run in a process of its own (the CLI as they start it) isn't counted: V8 sees the test workers.
  coverage:
    name: coverage (a report, not a gate)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet anthropic openai google-genai boto3 aiohttp websockets aiobotocore uvloop
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  test:
    needs: scope
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    # Windows starts a process several times slower than the others; the suite starts thousands.
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
        node: [22, 24]
        include:
          # The oldest Node the packages' engines allow, the first 22 whose built-in SQLite has
          # full-text search, which every store has. Here the packages are built and the suite, the
          # golden replay and the smoke below run on it, so an API newer than the minimum fails;
          # the typecheck and the Python SDK's tests, which no Node changes, run on 22 and 24.
          - os: ubuntu-latest
            node: 22.16.0
            minimum: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The provider SDKs the Python agents in testing/ build their clients with (testing/default-clients),
      # and the async clients the guard and in-process capture are tested with: without them the Python
      # cases of guard-udp-async, python-capture-async and realtime-tunnel skip. uvloop runs on macOS
      # and Linux only.
      - run: python -m pip install --quiet anthropic openai google-genai boto3 aiohttp websockets aiobotocore
      - run: python -m pip install --quiet uvloop
        if: runner.os != 'Windows'
      - run: npm ci
      - run: npm run build
      # Test files are outside the build graph (each package compiles only src), so they get
      # their own strict pass. Without it a type error in a test only ever shows up at runtime.
      - run: npm run typecheck:tests
        if: ${{ !matrix.minimum }}
      # The GitHub Action and the Node preloads are JavaScript, type-checked from their JSDoc.
      - run: npm run typecheck:js
        if: ${{ !matrix.minimum }}
      - run: npm test
      - name: Python SDK tests
        if: ${{ !matrix.minimum }}
        working-directory: sdks/python
        shell: bash
        run: |
          python -m pip install --quiet pytest trio anyio -e .
          python -m pytest -q
      - name: SDK conformance (typescript and python clients)
        run: node --test --test-reporter=spec testing/conformance/conformance.test.mjs
      - name: shadowlap test (offline golden replay)
        shell: bash
        # A store of its own: the default one, in the folder it runs from, is the repository's root.
        run: |
          node packages/cli/bin/shadowlap.js --db "$(mktemp -d)/shadowlap.db" test testing/golden/reference-agent --junit shadowlap-junit.xml
          grep -q 'failures="0"' shadowlap-junit.xml
      - name: CLI smoke (record, replay, fork)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/testing/reference-agent/dist/mock-server.js" > mock.url 2>/dev/null &
          MOCK=$!
          for i in $(seq 1 50); do [ -s mock.url ] && break; sleep 0.1; done
          export SHADOWLAP_UPSTREAM_ANTHROPIC="$(cat mock.url)" NO_COLOR=1
          CLI="$GITHUB_WORKSPACE/packages/cli/bin/shadowlap.js"
          AGENT="$GITHUB_WORKSPACE/testing/reference-agent/dist/main.js"
          # Capture, print, then grep: `cmd | grep -q` under pipefail fails when grep closes the pipe early (EPIPE).
          OUT="$(node "$CLI" run -- node "$AGENT" 2>&1)"; echo "$OUT" | tail -4; grep -q 'Recorded' <<<"$OUT"
          RUN="$(node "$CLI" ls | head -1 | awk '{print $1}')"; echo "run: $RUN"
          OUT="$(node "$CLI" replay "$RUN" --strict 2>&1)"; echo "$OUT" | tail -3; grep -q 'Replay clean: 30/30' <<<"$OUT"
          # macOS ships bash 3.2, where `VAR=x fn` doesn't reach a function's children; use env.
          if env AGENT_SYSTEM_SUFFIX='Be brief.' node "$CLI" replay "$RUN" --strict >/dev/null 2>&1; then echo 'expected --strict to fail on a fork'; exit 1; fi
          OUT="$(env AGENT_SYSTEM_SUFFIX='Be brief.' node "$CLI" replay "$RUN" 2>&1)"; echo "$OUT" | tail -8; grep -q 'Diverged at call 3' <<<"$OUT"
          OUT="$(node "$CLI" show "$RUN")"; echo "$OUT" | head -8; grep -q 'send_email' <<<"$OUT"
          # The same scenario in Python, through the CLI: the real anthropic package and the Python SDK.
          PYAGENT="$GITHUB_WORKSPACE/testing/reference-agent/python/agent.py"
          OUT="$(env AGENT_DATE=2026-09-16 node "$CLI" run -- python "$PYAGENT" 2>&1)"; echo "$OUT" | tail -3; grep -q 'Recorded' <<<"$OUT"
          PYRUN="$(node "$CLI" ls | head -1 | awk '{print $1}')"
          OUT="$(env AGENT_DATE=2026-09-16 node "$CLI" replay "$PYRUN" --strict 2>&1)"; echo "$OUT" | tail -2; grep -q 'Replay clean: 30/30' <<<"$OUT"
          OUT="$(env AGENT_DATE=2026-09-17 node "$CLI" replay "$PYRUN" 2>&1)"; echo "$OUT" | tail -6; grep -q 'Diverged at call 3' <<<"$OUT"
          kill $MOCK
      # `if: always()` is the whole point: the run that fails is the one whose report is worth
      # keeping. Test files run in parallel workers, so a failure that does not reproduce locally is
      # only ever identifiable from the report of the run that saw it.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            vitest-junit.xml
            shadowlap-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The Python SDK supports 3.9 onward, and some of what it promises (an injected timeout is an
  # asyncio.TimeoutError) differs before 3.11: its own tests run on the oldest version, current ones,
  # and the free-threaded build of 3.14 (3.14t), where nothing holds the GIL for the SDK. trio and anyio
  # are installed for the tests that run tools under them; the SDK itself needs neither. Each job also
  # builds the wheel and checks it carries py.typed and the shadowlap command.
  # Ubuntu 24.04, not ubuntu-latest: setup-python has no 3.9 for Ubuntu 26.04, which ubuntu-latest
  # becomes from October 19, 2026.
  python-sdk:
    name: python sdk on ${{ matrix.python }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.13', '3.14', '3.14t']
        include:
          # Installing shadowlap loads its pytest plugin into every pytest run, so it must load on the
          # oldest pytest it supports with the oldest pluggy that allows, and on pytest 7.4 with pluggy
          # 1.1 (before new-style hook wrappers). anyio's own pytest plugin needs a newer pluggy, so
          # those two run the async tests under trio alone.
          - python: '3.9'
            pytest: pytest==6.2.5 pluggy==0.13.1
            async: trio
          - python: '3.10'
            pytest: pytest==7.4.4 pluggy==1.1.0
            async: trio
    env:
      SHADOWLAP_TEST_WHEEL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet ${{ matrix.pytest || 'pytest' }} ${{ matrix.async || 'trio anyio' }} -e sdks/python
      - run: python -m pytest -q sdks/python/tests

  # The network guard and in-process capture load into every Python process of an agent as a
  # sitecustomize, and patch socket and asyncio, whose insides change from one version to the next.
  # The test job runs their tests on 3.12; this runs them on the oldest Python the SDK supports and
  # on the others up to the newest, as an agent's Python may be any of them. Node 24, as nothing
  # here changes with the Node.
  python-guard:
    name: python guard on ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet anthropic openai google-genai boto3 aiohttp websockets aiobotocore uvloop
      - run: npm ci
      - run: npm run build
      - name: The guard's and capture's tests, in this Python
        env:
          SHADOWLAP_PYTHON: python
        run: npx vitest run packages/cli/test/guard.test.ts packages/cli/test/guard-hosts.test.ts packages/cli/test/guard-udp-async.test.ts packages/cli/test/python-capture-async.test.ts packages/cli/test/realtime-tunnel.test.ts packages/cli/test/preload-hello.test.ts testing/default-clients/test

  # The SDK's types, to mypy's strictest settings (sdks/python/pyproject.toml), checked against the
  # real types of trio, anyio and pytest. Pinned, so a new mypy changes this job only when the pin does.
  python-sdk-types:
    name: python sdk types (mypy --strict)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet mypy==2.4.0 pytest trio anyio -e sdks/python
      - name: mypy --strict
        working-directory: sdks/python
        run: python -m mypy
