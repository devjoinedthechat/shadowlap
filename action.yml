# How the GitHub Marketplace lists the action: a name no other listing, user or organization has, a
# description of at most 125 characters, and a badge (a Feather icon GitHub supports, and one of its
# nine colors).
name: shadowlap test
description: "Change safety for agents: replay committed agent runs offline, and fail the check when a request changes or a check fails."
author: devjoinedthechat
branding:
  icon: repeat
  color: green

inputs:
  recordings:
    description: Recording directories written by `shadowlap pack`, separated by spaces or new lines. A `*` is allowed in the last part of a path. A path that names no pack fails as a test, and a pattern that matches none fails the step.
    default: goldens/*
  working-directory:
    description: Where the recorded commands run and relative paths start.
    default: .
  version:
    description: The shadowlap version to install from npm, e.g. 0.1.0. Empty installs this action's own release, the version its packages/cli/package.json names.
    default: ''
  build-from-source:
    description: Build the CLI from this action's own source rather than install it from npm, as for an action used at a commit that is no release (version is then ignored). It adds about a minute. No package's install script runs, and the build runs with none of the job's environment but what npm and Node need, in a home and a temporary folder of its own, so no secret, key or token the step was given reaches it.
    default: 'false'
  writes:
    description: What write tools do after a divergence (block, stub or allow).
    default: block
  guard:
    description: The network guard for connections that bypass shadowlap (block, warn or off).
    default: block
  guard-accept:
    description: What guard block accepts unwatched, as guard.accept in shadowlap.config.json does. claude-code, the only one, takes the Claude Code CLI the Claude Agent SDK runs as it is, which no preload loads into, so the connections it can make that the guard can't watch are named and fail nothing; Node and Python processes keep block. Empty accepts nothing more than the config does.
    default: ''
  online:
    description: Allow live model calls after a divergence. By default every provider is offline and a live call fails the recording.
    default: 'false'
  fail-on-divergence:
    description: Fail the step when a recording fails. With false, read the failed output instead.
    default: 'true'
  summary:
    description: Write the report to the job summary.
    default: 'true'
  annotations:
    description: Annotate failed recordings on the pull request.
    default: 'true'
  junit:
    description: Also write a JUnit XML report to this path, relative to working-directory.
    default: ''
  store:
    description: The store that keeps the test history and the replays, relative to working-directory. Empty uses the project's, .shadowlap/shadowlap.db.
    default: ''
  inconclusive:
    description: What an inconclusive golden does to the step, as shadowlap test --inconclusive takes it (fail or warn). An inconclusive golden is one whose gate ran out of attempts between its bounds, whose check could not be decided, whose injection gate showed too little to say, or whose provider was unavailable too many attempts in a row. fail counts it in the failed output and fails the step; warn lets it through with a warning annotation. Empty does as shadowlap test does by default, fail, except that a gate against history whose golden has fewer than 30 sessions only warns when it runs out of attempts, until the plan reads a decline or a drop in its sessions (99 to 1). Either way the inconclusive output counts it.
    default: ''
  max-attempts:
    description: Raise every gate's limit for this run, as shadowlap test --max-attempts. Empty keeps each gate's own max.
    default: ''
  keep-history:
    description: Keep the store, and with it the test history, between jobs in the GitHub Actions cache, so a gate against a golden's history has a baseline (auto, true or false). auto keeps it when shadowlap.config.json gives a golden a gate against history. Each run saves the store under a key of its own; a job restores its branch's newest, or the default branch's for a branch's first job.
    default: auto
  push:
    description: Push every test run and the session's report to the team store set in shadowlap.config.json (shadowlap test --push), and each fix that fix-on-failure opens, so teammates see it on their Fixes page. The job needs credentials for the bucket (shadowlap store ci prints the steps that give them, and with R2 keeps its keys and the push to jobs that aren't a pull request's); a pull request's job writes only to its own folder. A push that can't happen, such as one without credentials or from a fork's pull request, is a warning that says why; it never fails the job or keeps a fix's pull request from opening.
    default: 'false'
  fix-on-failure:
    description: When a golden fails an outcome check, run blame, repair and verify, and open a pull request with the fix verify accepted. Never for a divergence, nor from a fix's own branch or a merge queue's; never merges. Needs contents and pull-requests write permission, the repairer's key, and the agent's own provider keys (blame and verify run it live); github-token says how the pull request's checks start.
    default: 'false'
  fix-budget:
    description: Dollars fix-on-failure may spend per failing golden, on blame, the repairer and verify together.
    default: '2.00'
  fix-build:
    description: A shell command that builds the agent once a fix changes its source, such as npm run build, as for shadowlap repair --build. It runs in each candidate's worktree, which has a copy of the working tree's node_modules rather than links to it, so nothing it writes reaches the working tree, and in the working tree around the replay of the fix's branch, then once more after the fix is taken back out. Empty runs the agent as it is.
    default: ''
  repairer:
    description: The model that proposes fixes, as for shadowlap repair --repairer (claude-code, claude-code:<model>, anthropic, anthropic:<model>, openai:<model>). Empty uses repair.repairer in shadowlap.config.json.
    default: ''
  github-token:
    description: The token fix-on-failure pushes a fix's branch and opens its pull request with, and the pull request comment is kept with. A GitHub App's token or a personal access token makes GitHub start the fix pull request's workflows. Empty uses the job's GITHUB_TOKEN, for which GitHub starts none, so the action then starts the workflow it runs in on the fix's branch, which needs a workflow_dispatch trigger and actions write permission; the pull request says which happened. The CLI and the agent never get this token.
    default: ''
  comment:
    description: On a pull request, keep one comment on it with each golden's verdict line, compared with the base branch's last session when the test history has one, with what a run costs and each injection gate's verdict, edited in place on every run. Needs pull-requests write permission. A pull request from a fork, whose token may not comment, gets none, and the job summary says so.
    default: 'true'
  decisions:
    description: On a pull request, add to the comment the decisions the branch changes at rank 1 and 2, from shadowlap decisions --from-code. It asks the goldens' models on every push, so the step needs their providers' keys.
    default: 'false'

outputs:
  passed:
    description: Recordings that passed, or were let through (an inconclusive one the inconclusive input lets pass counts here and in inconclusive).
    value: ${{ steps.test.outputs.passed }}
  failed:
    description: Recordings that fail the step - diverged, made a live call, exited with an error, or failed a check or an injection gate - and inconclusive ones, unless inconclusive is warn or, left empty, the recording's gate against history ran out of attempts with fewer than 30 sessions behind it, until the plan reads a decline or a drop in them (99 to 1). The Alerts workflow posts when it isn't 0.
    value: ${{ steps.test.outputs.failed }}
  inconclusive:
    description: Recordings whose verdict is inconclusive (a gate that ran out of attempts between its bounds, a check that could not be decided, an injection gate that showed too little to say, or a provider unavailable too many attempts in a row), whatever the inconclusive input made of them.
    value: ${{ steps.test.outputs.inconclusive }}
  diverged:
    description: Recordings that failed because the agent sent a different request.
    value: ${{ steps.test.outputs.diverged }}
  checks-failed:
    description: Recordings that failed an outcome check.
    value: ${{ steps.test.outputs.checks-failed }}
  session:
    description: The test session's id in the store's history.
    value: ${{ steps.test.outputs.session }}
  fixes:
    description: Fix pull requests opened by fix-on-failure.
    value: ${{ steps.test.outputs.fixes }}
  fix-prs:
    description: Their URLs, separated by spaces.
    value: ${{ steps.test.outputs.fix-prs }}
  report-json:
    description: Path of the JSON report.
    value: ${{ steps.test.outputs.report-json }}
  report-markdown:
    description: Path of the Markdown report.
    value: ${{ steps.test.outputs.report-markdown }}
  junit:
    description: Path of the JUnit XML report.
    value: ${{ steps.test.outputs.junit }}

runs:
  using: composite
  steps:
    - name: Check Node.js
      shell: bash
      run: |
        node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 22 && b >= 16) || a >= 24)) { console.log("::error title=shadowlap::shadowlap needs Node.js 22.16 or later (not 23), whose built-in SQLite has full-text search; this job has " + process.version + ". Add actions/setup-node with node-version: 22 before this step."); process.exit(1); }'

    - name: Install shadowlap ${{ inputs.version }}
      id: install
      if: inputs.build-from-source != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FIX_ON_FAILURE: ${{ inputs.fix-on-failure }}
      run: |
        # The CLI this action was released with, unless the step names another: the action's tag and
        # `version` name one release, and an update that moves only the tag would have this action
        # drive another CLI than its own.
        action=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/packages/cli/package.json').version")
        if [ -z "$VERSION" ]; then VERSION="$action"; elif [ "$VERSION" != "$action" ]; then echo "::warning title=shadowlap::this action is v$action but installs shadowlap $VERSION; set version: $action, or leave it out"; fi
        # fix-on-failure may ask Claude for the fix through the Anthropic SDK, which the CLI imports from
        # where it is installed and names as neither dependency nor peer: it goes in beside it, at the
        # version this release was tested with, never whatever is newest, in a job that holds the job's
        # token and the provider keys.
        sdk=()
        if [ "$FIX_ON_FAILURE" = true ]; then sdk=("@anthropic-ai/sdk@$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package-lock.json').packages['node_modules/@anthropic-ai/sdk']?.version ?? '>=0.126.0 <1'")"); fi
        # No package's install script runs in a job that may hold provider keys and tokens: none of
        # these packages needs one.
        npm install --prefix "$RUNNER_TEMP/shadowlap-cli" --no-save --no-audit --no-fund --ignore-scripts "shadowlap@$VERSION" "${sdk[@]}"
        echo "cli=$RUNNER_TEMP/shadowlap-cli/node_modules/shadowlap/bin/shadowlap.js" >> "$GITHUB_OUTPUT"

    - name: Build shadowlap from the action's source
      id: build
      if: inputs.build-from-source == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # The build runs the code of every package the monorepo builds with. None of their install
        # scripts runs (the build needs none), and it gets nothing of the job's environment but what npm
        # and Node need: no provider key, token or other secret the step was given. Its home and its
        # temporary folder are its own and empty, so what the job's steps keep there (git and gh
        # credentials, a cloud CLI's sign-in, the runner's temporary files) is not where it looks.
        keep=()
        for name in PATH USER LOGNAME SHELL LANG LC_ALL RUNNER_OS CI HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy NODE_EXTRA_CA_CERTS npm_config_cache SYSTEMROOT SystemRoot WINDIR COMSPEC ComSpec PATHEXT PROGRAMDATA ProgramFiles; do
          if [ -n "${!name+set}" ]; then keep+=("$name=${!name}"); fi
        done
        if [ ! -f packages/cli/dist/index.js ]; then
          home=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/shadowlap-build-XXXXXX")
          mkdir "$home/tmp"
          own=("HOME=$home" "USERPROFILE=$home" "APPDATA=$home" "LOCALAPPDATA=$home" "TMPDIR=$home/tmp" "TEMP=$home/tmp" "TMP=$home/tmp")
          env -i "${keep[@]}" "${own[@]}" npm ci --ignore-scripts --no-audit --no-fund
          env -i "${keep[@]}" "${own[@]}" npm run build
          rm -rf "$home"
        fi
        echo "cli=$(pwd)/packages/cli/bin/shadowlap.js" >> "$GITHUB_OUTPUT"

    # The action runs on pull_request, push, schedule, workflow_dispatch and merge_group alone
    # (action/events.mjs): on any other event this step keeps nothing, so the cache is neither
    # restored nor saved, and the replay stops before it tests anything.
    - name: Find the test history to keep
      id: history
      shell: bash
      env:
        INPUT_KEEP_HISTORY: ${{ inputs.keep-history }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_STORE: ${{ inputs.store }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "${{ github.action_path }}/action/history.mjs"

    - name: Restore the test history
      if: steps.history.outputs.keep == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.history.outputs.path }}
        key: ${{ steps.history.outputs.key }}
        restore-keys: ${{ steps.history.outputs.restore-keys }}

    - name: Replay the recordings
      id: test
      shell: bash
      env:
        SHADOWLAP_CLI: ${{ steps.install.outputs.cli || steps.build.outputs.cli }}
        INPUT_RECORDINGS: ${{ inputs.recordings }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_WRITES: ${{ inputs.writes }}
        INPUT_GUARD: ${{ inputs.guard }}
        INPUT_GUARD_ACCEPT: ${{ inputs.guard-accept }}
        INPUT_ONLINE: ${{ inputs.online }}
        INPUT_FAIL_ON_DIVERGENCE: ${{ inputs.fail-on-divergence }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_STORE: ${{ inputs.store }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_FIX_ON_FAILURE: ${{ inputs.fix-on-failure }}
        INPUT_FIX_BUDGET: ${{ inputs.fix-budget }}
        INPUT_FIX_BUILD: ${{ inputs.fix-build }}
        INPUT_REPAIRER: ${{ inputs.repairer }}
        INPUT_INCONCLUSIVE: ${{ inputs.inconclusive }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_DECISIONS: ${{ inputs.decisions }}
        # For git's push and GitHub's API alone: run.mjs takes both, and every other GitHub token the job
        # holds, out of what the CLI and the agent get.
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        SHADOWLAP_JOB_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/action/run.mjs"

    # Saved whether the tests passed or not: a run that failed is history too, and the next one's baseline.
    - name: Keep the test history
      if: always() && steps.history.outputs.keep == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.history.outputs.path }}
        key: ${{ steps.history.outputs.key }}
