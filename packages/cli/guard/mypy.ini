# The Python guard (sitecustomize.py and the modules it loads) to mypy's strictest settings, as the
# SDK is (sdks/python/pyproject.toml). `npm run lint` runs it from the repository's root, where the
# paths below are read from. The guard runs in an agent's Python, as old as 3.9: its annotations are
# never evaluated there (from __future__ import annotations), and typing itself is imported for mypy
# alone. 3.10 is the oldest Python mypy checks for.
[mypy]
strict = True
python_version = 3.10
warn_unreachable = True
files = packages/cli/guard/sitecustomize.py, packages/cli/guard/_shadowlap_capture.py, packages/cli/guard/_shadowlap_input.py

# Libraries the guard patches or reads when an agent has them: none is a dependency of its own.
[mypy-aiohttp.*]
ignore_missing_imports = True
