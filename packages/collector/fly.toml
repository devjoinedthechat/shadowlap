# Fly.io: `fly launch --copy-config --no-deploy` from the repository root, then `fly volumes create
# collector_data --size 1` and `fly deploy --config packages/collector/fly.toml --dockerfile packages/collector/Dockerfile`.
# Point a domain you control at the app: `fly certs add <your-host>`, then add the CNAME it prints.
app = "shadowlap-telemetry"
primary_region = "ams"

[build]
  dockerfile = "packages/collector/Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  COLLECTOR_DB = "/data/collector.db"

[[mounts]]
  source = "collector_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
