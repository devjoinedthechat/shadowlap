# The Python outside the SDK (the guard's preloads, test agents, the demo store's agents, examples)
# is linted with the SDK's rules: they live in sdks/python/pyproject.toml.
extend = "sdks/python/pyproject.toml"

[lint.extend-per-file-ignores]
# A preload never fails the process it is loaded into, so what goes wrong in it is passed over (S110),
# and it posts to the sidecar at the URL the CLI gave it (S310).
"packages/cli/guard/*.py" = ["S110", "S310"]
# The examples call the model API where ANTHROPIC_BASE_URL says, as an SDK does.
"examples/**" = ["S310"]
